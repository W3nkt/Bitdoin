[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
port = 54323

[inbucket]
port = 54324

[storage]
file_size_limit = "50MiB"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173", "store.bitdoin.app://auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.sms.twilio]
enabled = false

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = ""

# Authentication is enforced inside the function with auth.getUser(). Keeping
# gateway verification off avoids rejecting valid sessions before the function
# can validate them and return a useful error.
[functions.verify-receipt]
verify_jwt = false

[functions.premium-coach]
verify_jwt = false

[functions.generate-academy-week]
verify_jwt = false

[functions.premium-arcade-pool]
verify_jwt = false

# Bitty serves guests too; signed-in users are identified inside the function.
[functions.bitty-chat]
verify_jwt = false

# Guest checkout autofill; only a narrow, rate-limited lookup is exposed.
[functions.checkout-customer]
verify_jwt = false

# Called by Telegram, which cannot send a Supabase JWT; the function checks
# Telegram's X-Telegram-Bot-Api-Secret-Token header instead.
[functions.telegram-webhook]
verify_jwt = false

# Called by pg_cron every 15 minutes; idempotent (one reminder per member per day).
[functions.telegram-daily-reminder]
verify_jwt = false

# Called by pg_cron (daily reminders / new-book digest; both idempotent) and by
# the app. Staff-only and per-user actions check the JWT inside the function.
[functions.send-push]
verify_jwt = false

# Called by pg_cron every 5 minutes and after an admin's test alert. Only sends
# alerts already queued in the database, at most once each (migration 122).
[functions.academic-alerts]
verify_jwt = false

[functions.academic-ocr]
verify_jwt = false
